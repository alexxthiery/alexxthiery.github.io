<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 235" role="img" aria-labelledby="title desc">
<title id="title">Three pairings of four roots</title><desc id="desc">Pairing A connects 1 to 2 and 3 to 4. Pairing B connects 1 to 3 and 2 to 4. Pairing C connects 1 to 4 and 2 to 3.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263340} .label{font-size:18px} .small{font-size:14px;fill:#596674} .heading{font-size:19px;font-weight:600} .node{fill:#fff;stroke:#263340;stroke-width:1.5} .edge{fill:none;stroke:#546572;stroke-width:1.4}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="150" y="27" text-anchor="middle" class="heading">A</text>
<path d="M95,70 L205,70" fill="none" stroke="#247ba0" stroke-width="3"/>
<path d="M95,150 L205,150" fill="none" stroke="#b66b29" stroke-width="3"/>
<circle cx="95" cy="70" r="16" class="node"/><text x="95" y="76" text-anchor="middle" class="label">1</text>
<circle cx="205" cy="70" r="16" class="node"/><text x="205" y="76" text-anchor="middle" class="label">2</text>
<circle cx="95" cy="150" r="16" class="node"/><text x="95" y="156" text-anchor="middle" class="label">3</text>
<circle cx="205" cy="150" r="16" class="node"/><text x="205" y="156" text-anchor="middle" class="label">4</text>
<text x="150" y="205" text-anchor="middle" class="label">r₁r₂ + r₃r₄</text>
<text x="430" y="27" text-anchor="middle" class="heading">B</text>
<path d="M375,70 L375,150" fill="none" stroke="#247ba0" stroke-width="3"/>
<path d="M485,70 L485,150" fill="none" stroke="#b66b29" stroke-width="3"/>
<circle cx="375" cy="70" r="16" class="node"/><text x="375" y="76" text-anchor="middle" class="label">1</text>
<circle cx="485" cy="70" r="16" class="node"/><text x="485" y="76" text-anchor="middle" class="label">2</text>
<circle cx="375" cy="150" r="16" class="node"/><text x="375" y="156" text-anchor="middle" class="label">3</text>
<circle cx="485" cy="150" r="16" class="node"/><text x="485" y="156" text-anchor="middle" class="label">4</text>
<text x="430" y="205" text-anchor="middle" class="label">r₁r₃ + r₂r₄</text>
<text x="710" y="27" text-anchor="middle" class="heading">C</text>
<path d="M655,70 L765,150" fill="none" stroke="#247ba0" stroke-width="3"/>
<path d="M765,70 L655,150" fill="none" stroke="#b66b29" stroke-width="3"/>
<circle cx="655" cy="70" r="16" class="node"/><text x="655" y="76" text-anchor="middle" class="label">1</text>
<circle cx="765" cy="70" r="16" class="node"/><text x="765" y="76" text-anchor="middle" class="label">2</text>
<circle cx="655" cy="150" r="16" class="node"/><text x="655" y="156" text-anchor="middle" class="label">3</text>
<circle cx="765" cy="150" r="16" class="node"/><text x="765" y="156" text-anchor="middle" class="label">4</text>
<text x="710" y="205" text-anchor="middle" class="label">r₁r₄ + r₂r₃</text>
</svg>
